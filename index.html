<!DOCTYPE html>
<html>
<head>
  <title>D100 Roller</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: "Courier New", monospace;
      color: #4a90e2;
    }

    .dice {
      width: 180px;
      height: 180px;
      background: white;
      border: 4px solid #4a90e2;
      clip-path: polygon(
        50% 0%, 75% 10%, 95% 35%, 85% 75%,
        50% 100%, 15% 75%, 5% 35%, 25% 10%
      );
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 0 20px rgba(74,144,226,0.3);
      transition: transform 0.2s ease;
    }

    .rolling {
      animation: shake 0.4s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(8deg) scale(1.05); }
      50% { transform: rotate(-8deg) scale(1.05); }
      75% { transform: rotate(6deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="dice" id="dice">?</div>
  <button onclick="rollD100()">ROLL</button>

  <script>
    function rollD100() {
      const dice = document.getElementById("dice");
      const specialNumbers = [11,22,33,44,55,66,77,88,99,100];

      dice.classList.add("rolling");

      let rollInterval = setInterval(() => {
        let tempRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = tempRoll;
      }, 50);

      setTimeout(() => {
        clearInterval(rollInterval);
        dice.classList.remove("rolling");

        let finalRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = finalRoll;

        if (specialNumbers.includes(finalRoll)) {
          setTimeout(() => {
            window.location.href = "https://example.com"; // Replace with your URL
          }, 800);
        }

      }, 1000);
    }
  </script>

</body>
</html>
