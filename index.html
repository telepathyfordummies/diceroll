<!DOCTYPE html>
<html>
<head>
  <title>D100 Roller</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      font-family: "Courier New", monospace;
      color: lime;
    }

    .dice {
      width: 150px;
      height: 150px;
      border: 4px solid lime;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      margin-bottom: 20px;
      background: #111;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      background: lime;
      color: black;
      border: none;
    }
  </style>
</head>
<body>

  <div class="dice" id="dice">?</div>
  <button onclick="rollD100()">ROLL</button>

  <script>
    function rollD100() {
      const dice = document.getElementById("dice");
      const specialNumbers = [1,11,22,33,44,55,66,77,88,99,100];

      let rollInterval = setInterval(() => {
        let tempRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = tempRoll;
      }, 50);

      setTimeout(() => {
        clearInterval(rollInterval);
        let finalRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = finalRoll;

        if (specialNumbers.includes(finalRoll)) {
          setTimeout(() => {
            window.location.href = "https://example.com"; // Replace with your URL
          }, 800);
        }

      }, 1000);
    }
  </script>

</body>
</html>
