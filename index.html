<!DOCTYPE html>
<html>
<head>
  <title>DiceRoll!</title>
  <style>
  .banner {
  width: 100%;
  padding: 15px 0;
  background-color: #4a90e2; 
  color: white;               
  font-size: 20px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}


body {
  margin: 0;
  background: white;
  font-family: "Courier New", monospace;
  color: #4a90e2;
}


.container {
  height: calc(100vh - 60px); /* Subtract banner height */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

   .dice {
  width: 200px;
  height: 200px;
  aspect-ratio: 1 / 1;
  background: linear-gradient(
    145deg,
    #5aa1f0 0%,
    #4a90e2 60%,
    #3b7ccc 100%
  );
  border: 4px solid white;
  color: white;

  /* decagon-ish shape?? */
  clip-path: polygon(
    50% 0%,
    80% 10%,
    100% 35%,
    90% 75%,
    65% 95%,
    35% 95%,
    10% 75%,
    0% 35%,
    20% 10%
  );

  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 48px;
  font-weight: bold;

  /* Subtle depth, if you hate this take it out */
  box-shadow:
    0 8px 18px rgba(0,0,0,0.15),
    inset 0 4px 8px rgba(255,255,255,0.2),
    inset 0 -6px 12px rgba(0,0,0,0.15);

  transition: transform 0.2s ease;
}

    .rolling {
      animation: shake 0.4s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(8deg) scale(1.05); }
      50% { transform: rotate(-8deg) scale(1.05); }
      75% { transform: rotate(6deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="banner">
    <p>This one is very simple.</p>
    <p>Roll dice.</p>
    <p>The following numbers win a prize: 1, 11, 22, 33, 44, 55, 66, 77, 88, 99, 100.</p>
  </div>

  <!-- Container for Dice and Button -->
  <div class="container">
    <div class="dice" id="dice">?</div>
    <button onclick="rollD100()">ROLL</button>
  </div>

</body>

  <script>
    function rollD100() {
      const dice = document.getElementById("dice");
      const specialNumbers = [11,22,33,44,55,66,77,88,99,100];

      dice.classList.add("rolling");

      let rollInterval = setInterval(() => {
        let tempRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = tempRoll;
      }, 50);

      setTimeout(() => {
        clearInterval(rollInterval);
        dice.classList.remove("rolling");

        let finalRoll = Math.floor(Math.random() * 100) + 1;
        dice.innerText = finalRoll;

        if (specialNumbers.includes(finalRoll)) {
          setTimeout(() => {
            window.location.href = "https://archiveofourown.org/works/74818596"; 
          }, 800);
        }

      }, 1000);
    }
  </script>

</body>
</html>
